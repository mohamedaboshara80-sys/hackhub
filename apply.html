{% extends "base.html" %}
{% block title %}Apply · {{ h.name }}{% endblock %}
{% block content %}
<section class="card">
  <h1>Apply to {{ h.name }}</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Your username <input name="participant_username" required value="{{ form.get('participant_username','') }}"></label>
    <label>Team members' usernames <input name="team_members" required placeholder="alice, bob" value="{{ form.get('team_members','') }}">
      <small>Comma-separated. Each must be a registered participant.</small></label>
    <label>University / institution(s) <input name="institutions" required value="{{ form.get('institutions','') }}"></label>
    <div class="grid2">
      <label>Team name <input name="team_name" required value="{{ form.get('team_name','') }}"></label>
      <label>Team leader <input name="team_leader" required value="{{ form.get('team_leader','') }}"></label>
    </div>
    <label>Project name <input name="project_name" required value="{{ form.get('project_name','') }}"></label>
    <label>Field / domain
      <select name="domain" required>
        <option value="">Choose a domain</option>
        {% for d in domains %}<option {{ 'selected' if form.get('domain')==d }}>{{ d }}</option>{% endfor %}
      </select></label>
    <button class="btn">Send application</button>
  </form>
</section>
{% endblock %}
